name = "digifair-cloudflare-full-fa"
main = "src/index.ts"
compatibility_date = "2024-07-21"
compatibility_flags = ["nodejs_compat"]

# ===============================
# تنظیمات کامل Cloudflare - باید باشه
# ===============================

# 1. سایت استاتیک - public/index.html (لندینگ فارسی کپی‌رایت سیف #EF4056)
[site]
bucket = "./"

# 2. D1 - دیتابیس SQLite Edge برای کش سریع فارسی
[[d1_databases]]
binding = "DB_D1"
database_name = "digifair-fa-db"
database_id = "xxxx-xxxx-xxxx-d1-replace-with-real-id"
preview_database_id = "xxxx-preview-id"

# 3. Hyperdrive - اتصال به همون Postgres که Vercel استفاده می‌کنه
# اینجوری Vercel Node+Python و Cloudflare Node هر سه به یک Neon Postgres مشترک وصله
# پس دیتابیس‌ها به هم وصله - بدون تغییر متغیر
[[hyperdrive]]
binding = "HYPERDRIVE_PG"
id = "xxxx-hyperdrive-id-replace"
localConnectionString = "postgres://default:xxx@ep-xxx.neon.tech/verceldb?sslmode=require"
# localConnectionString = همون POSTGRES_URL که Vercel auto می‌سازه - Vercel > Storage > Create > Postgres
# برای اینکه DB ها به هم وصل بشن، همون URL رو اینجا paste کن

# 4. KV - کش فارسی برای OT - 6 ساعت
[[kv_namespaces]]
binding = "KV_FA"
id = "xxxx-kv-id-replace"
preview_id = "xxxx-kv-preview-id"

# 5. R2 - تصاویر webp نمایشگاه
[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "digifair-assets-fa"

# 6. Vars - متغیرهای پیش‌فرض - زبان فارسی
[vars]
DEFAULT_LANG = "fa-IR"
COMPANY = "شرکت گواه گستر جهان‌نما"
ENAMAD_CODE = "DF-ENM-1404-8821"
RUNTIME = "cloudflare-full-node-only-fa - چون Python ندارد - بک‌اند فقط Node"
PYTHON_AI_URL = "https://digifair-vercel.vercel.app/api/python/ai_match"
NOTE = "Cloudflare Workers Python native ندارد - برای AI باید به Vercel Python proxy کنی - هر دو یک DB مشترک via Hyperdrive"

# 7. Cron - OT scrape هر 6 ساعت - Asia/Tehran
[triggers]
crons = ["0 */6 * * *"]

# 8. Build - برای Pages (اگر Vite React بخوای)
# [build]
# command = "npm run build"

# 9. Routes (اختیاری)
# [[routes]]
# pattern = "digifair.ir/*"
# zone_name = "digifair.ir"
